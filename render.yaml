services:
  # ── Backend API (Node.js) ──────────────────────────────────────
  # ⚠️  SINGLE INSTANCE ONLY — DO NOT enable autoscaling or set numInstances > 1.
  #     Scheduled jobs (9 setInterval cron loops) and runFullPipeline execute
  #     IN-PROCESS. A second web instance would run every cron a second time:
  #     duplicate notifications/alerts, doubled LLM spend, and double-executed
  #     agents (the cmo_queue consumer and daily-monitor have no cross-instance
  #     lock). Horizontal scaling is UNSUPPORTED until the dedicated worker
  #     service exists (see DEPLOYMENT.md → "Future Worker Architecture (M8.4b)").
  #     Keep this service at exactly one instance (Render free/starter default).
  - type: web
    name: seo-agent-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://seo-agent-6jrv.onrender.com
      - key: BACKEND_URL
        value: https://seo-agent-backend-8mfz.onrender.com
      # Set these manually in Render dashboard → Environment:
      # FIREBASE_PROJECT_ID
      # FIREBASE_PRIVATE_KEY_ID
      # FIREBASE_PRIVATE_KEY      (paste with \n for newlines)
      # FIREBASE_CLIENT_EMAIL
      # FIREBASE_CLIENT_ID
      # FIREBASE_CLIENT_CERT_URL
      # JWT_SECRET

  # ── Frontend (Static Site) ─────────────────────────────────────
  - type: web
    name: seo-agent-frontend
    runtime: static
    buildCommand: npm install && npm run build && cp dist/index.html dist/200.html && mkdir -p dist/audit && cp dist/index.html dist/audit/index.html && mkdir -p dist/portal && cp dist/index.html dist/portal/index.html
    staticPublishPath: dist
    # SPA rewrite: all paths serve index.html so React Router works
    # Covers /audit, /portal, and any future client-side routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://seo-agent-backend-8mfz.onrender.com
